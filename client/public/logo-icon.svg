<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="astra-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F7CFF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="orbit-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F7CFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.9" />
    </linearGradient>
  </defs>
  <!-- Background Glow / Pill -->
  <rect width="48" height="48" rx="14" fill="#0B1020" />
  
  <!-- Orbital Arc Pathway -->
  <path d="M 8 36 C 14 18, 30 14, 40 18" stroke="url(#orbit-grad)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 3" />
  
  <!-- Upward Trajectory Arrow Pathway -->
  <path d="M 12 36 L 26 22 L 36 12" stroke="url(#astra-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Astra Star Core -->
  <path d="M 36 12 L 37.5 7 L 39 12 L 44 13.5 L 39 15 L 37.5 20 L 36 15 L 31 13.5 Z" fill="url(#astra-grad)" />
  
  <!-- Subsidiary Constellation Nodes -->
  <circle cx="12" cy="36" r="3" fill="#4F7CFF" />
  <circle cx="26" cy="22" r="3.5" fill="#8B5CF6" />
  <circle cx="36" cy="12" r="2" fill="#FFFFFF" />
</svg>
